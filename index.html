checklist and notify the customer early if timing changes. Address out-of-scope requests with a clear explanation and a fair choice.","Ask what worked and what was difficult. Implement one improvement. Obtain explicit permission for any public quote and preserve its meaning."],example:"“Here is the agreed checklist. Please send the three sample request types by Tuesday. I will share the first draft Friday. One revision is included; additional workflows need a separate scope.”",workshop:"Write your welcome, delivery checklist, and three feedback questions. Test the instructions with a willing reader.",check:"The customer knows what happens next, how to ask for help, and how completion is confirmed."},{title:"Build repeatable systems and read evidence",teach:["Choose one repeated task. Write its trigger, owner, steps, finish condition, and exceptions. Test manually before automating.","Track activity and outcomes separately with dates and definitions. Include time and costs. Small samples suggest questions; they do not prove causation.","Find the bottleneck and change one factor. Log the baseline, change, observation window, result, and next decision."],example:"Ten appropriate invitations produced three replies, one discovery conversation, and no purchase. Before increasing volume, review where interest stopped and ask whether the offer matched the need.",workshop:"Create one reusable checklist and a simple weekly scorecard. Run the checklist once, note the failure point, and revise it.",check:"Someone else can follow the process, and each metric has a denominator and a useful decision attached."},{title:"Build sustainable options",teach:["Compare possible paths against skills, available hours, resources, customer demand, and downside. An unlocked option is a path to test, not a financial outcome.","Set a capacity limit before taking on work. Decide what to stop or defer so the new experiment fits.","Choose a review date and a decision rule. Continue, adjust, or stop based on actual evidence and personal constraints. This training does not provide individualized investment or tax advice."],example:"With four available hours a week, test one small service pilot rather than three business models. Allocate time to delivery, research, and review. Pause if the workload exceeds the planned capacity.",workshop:"Write a 30-day plan with one experiment, a weekly time limit, the first action, a stop condition, and a review date.",check:"Your plan is feasible in your real week and defines what would make you change course."}];const Nf=(n,e,t=[])=>{const s=document.createElementNS("http://www.w3.org/2000/svg",n);return Object.keys(e).forEach(r=>{s.setAttribute(r,String(e[r]))}),t.length&&t.forEach(r=>{const i=Nf(...r);s.appendChild(i)}),s};var Wg=([n,e,t])=>Nf(n,e,t);const zg=n=>Array.from(n.attributes).reduce((e,t)=>(e[t.name]=t.value,e),{}),Qg=n=>typeof n=="string"?n:!n||!n.class?"":n.class&&typeof n.class=="string"?n.class.split(" "):n.class&&Array.isArray(n.class)?n.class:"",Yg=n=>n.flatMap(Qg).map(t=>t.trim()).filter(Boolean).filter((t,s,r)=>r.indexOf(t)===s).join(" "),Xg=n=>n.replace(/(\w)(\w*)(_|-|\s*)/g,(e,t,s)=>t.toUpperCase()+s.toLowerCase()),Eh=(n,{nameAttr:e,icons:t,attrs:s})=>{const r=n.getAttribute(e);if(r==null)return;const i=Xg(r),a=t[i];if(!a)return console.warn(`${n.outerHTML} icon name was not found in the provided icons object.`);const c=zg(n),[l,u,h]=a,f={...u,"data-lucide":r,...s,...c},C=Yg(["lucide",`lucide-${r}`,c,s]);C&&Object.assign(f,{class:C});const _=Wg([l,f,h]);return n.parentNode?.replaceChild(_,n)};const we={xmlns:"http://www.w3.org/2000/svg",width:24,height:24,viewBox:"0 0 24 24",fill:"none",stroke:"currentColor","stroke-width":2,"stroke-linecap":"round","stroke-linejoin":"round"};const Zg=["svg",we,[["path",{d:"M5 12h14"}],["path",{d:"m12 5 7 7-7 7"}]]];const eE=["svg",we,[["path",{d:"M12 7v14"}],["path",{d:"M3 18a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h5a4 4 0 0 1 4 4 4 4 0 0 1 4-4h5a1 1 0 0 1 1 1v13a1 1 0 0 1-1 1h <div id="app"><section class="opening" aria-label="Opening the game"><small>THE UNWRITTEN REACH</small><h1>OYO: UNLOCKED</h1><p id="opening-status" role="status">Opening your adventure…</p><button id="opening-retry" hidden>Reload game</button><noscript><p>Turn on JavaScript in your browser to play.</p></noscript></section></div>
<div id="notice" role="status" aria-live="polite"></div>
<script id="opening-controller">
(()=>{
 let opened=false;
 const fail=()=>{if(opened)return;const status=document.getElementById('opening-status'),retry=document.getElementById('opening-retry');if(status)status.textContent='The game could not finish opening. Check your connection, then reload. If it continues, the published game needs an update.';if(retry)retry.hidden=false;};
 const timer=setTimeout(fail,15000);
 window.oyoBoot={ready(){opened=true;clearTimeout(timer);}};
 window.addEventListener('error',fail);
 document.getElementById('opening-retry').addEventListener('click',()=>location.reload());
})();
</script>
